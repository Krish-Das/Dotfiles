# vim:fileencoding=utf-8:ft=tmux

set-window-option -g mode-keys vi
set -g history-limit 10000
set -g mouse on
set -s escape-time 0
set-option -g focus-events on
# set different shell e.g.: fish
# set-option -g default-shell "/run/current-system/sw/bin/fish"

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Terminal
set -ga terminal-overrides ",*-256color:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

set -g allow-rename on
set -g renumber-windows on
set -g set-titles on

set -g detach-on-destroy off

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on


# --- █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀ █▀ ---
# --- █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█ ---

# Set leader key
# C-s C-a C-t C-z C-Space
# unbind C-b
# set -g prefix C-s
# bind C-s send-prefix
set-option -g prefix2 none

unbind %
unbind '"'
unbind |
unbind _

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Move between panes
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Resize panes
bind-key -r - resize-pane -D 5
bind-key -r + resize-pane -U 5
bind-key -r > resize-pane -R 5
bind-key -r < resize-pane -L 5

# Vim mode for yank and select
bind-key -T copy-mode-vi "v" send -X begin-selection
bind-key -T copy-mode-vi "y" send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Create new session with Shift+N
unbind N
bind-key N command-prompt "new-session -s '%%'"

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Switch between two most recently used windows
bind Space last-window

# Detach client
unbind q
bind q detach-client

# Kill session
unbind Q
bind-key Q confirm-before "kill-session"

unbind b
bind-key b set-option status


# --- █▀█ █▀▀ █░░ █▀█ ▄▀█ █▀▄ ---
# --- █▀▄ ██▄ █▄▄ █▄█ █▀█ █▄▀ ---

unbind r
bind r source-file ~/.config/tmux/tmux.conf


# --- █▀ ▀█▀ ▄▀█ ▀█▀ █░█ █▀   █▄▄ ▄▀█ █▀█ ---
# --- ▄█ ░█░ █▀█ ░█░ █▄█ ▄█   █▄█ █▀█ █▀▄ ---

# Status line customisation
set-option -g status-left-length 100
# set-option -g status-right-length 100
set-option -g status-left " #[fg=red]#[bold]#{session_name} "
set-option -g status-right ""

set-option -g status-style "fg=default bg=default"

set-option -g window-status-format " #[fg=white]#{window_name} "
set-option -g window-status-current-format " #[default]#{window_name}#[bold]#{window_flags} "
set-option -g window-status-current-style "fg=black bg=red"
set-option -g window-status-activity-style none
set-option -g status-position bottom;


# --- █▀█ █░░ █░█ █▀▀ █ █▄░█ █▀ ---
# --- █▀▀ █▄▄ █▄█ █▄█ █ █░▀█ ▄█ ---

# TMP Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-resurrect'

unbind s
set -g @sessionx-bind 's'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '40%'

# WARN: Keep this line at the bottom
# clone the repo in tmux/plugin dir (might need to create it)
# reload the config and then hit "prefix -> I" (shift + i)
run '~/.config/tmux/plugins/tpm/tpm'
