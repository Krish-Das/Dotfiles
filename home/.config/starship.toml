format = """
$directory\
$git_branch\
$git_status
$character"""

right_format = """
$cmd_duration
"""

add_newline = false

[character]
success_symbol = "[󰁔](bold green)"
error_symbol = "[󰁔](bold red)"
vimcmd_symbol = "[󰁍](bold green)"
vimcmd_replace_one_symbol = "[󰁍](bold purple)"
vimcmd_replace_symbol = "[󰁍](bold purple)"
vimcmd_visual_symbol = "[󰁍](bold yellow)"
# ⋊>

[cmd_duration]
min_time = 300
show_milliseconds = false
disabled = false

[package]
disabled = true

[directory]
style = "cyan bold"
truncate_to_repo = true
truncation_length = 1
read_only = ' 􀎡 '

[git_branch]
symbol = 'git' # ''
format = '[$symbol:\([$branch](bold red)\)](bold blue) '

[git_status]
style = "bold yellow"
deleted = '-'
