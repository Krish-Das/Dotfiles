format = """
$directory$git_branch$git_status
$character"""
right_format = """
$all
$cmd_duration
"""

add_newline = false

[character]
# success_symbol = ''
# vimcmd_symbol = '[V](bold cyan) '
# ⋊>

[cmd_duration]
min_time = 300
show_milliseconds = false
disabled = false

[package]
disabled = true

[directory]
style = "cyan bold"
truncate_to_repo = true
truncation_length = 2

[git_branch]
symbol = " "

[git_status]
deleted = '-'
