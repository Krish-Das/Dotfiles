# default-config:
# https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

font=JetBrainsMono Nerd Font:size=12:fontfeatures=ss01=1:fontfeatures=zero
font-size-adjustment=0.5
bold-text-in-bright=yes
word-delimiters=,│`|:"'()[]{}<>
initial-color-theme=dark

[url]
osc8-underline=always

[cursor]
beam-thickness=2

[colors-light]
dim-blend-towards=white

# Builtin Pastel Dark: https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/foot/Builtin%20Pastel%20Dark.ini
[colors-dark]
alpha=1.0
cursor=000000 ffffff
foreground=bbbbbb
background=000000
regular0=4f4f4f
regular1=ff6c60
regular2=a8ff60
regular3=ffffb6
regular4=96cbfe
regular5=ff73fd
regular6=c6c5fe
regular7=eeeeee
bright0=7c7c7c
bright1=ffb6b0
bright2=ceffac
bright3=ffffcc
bright4=b5dcff
bright5=ff9cfe
bright6=dfdffe
bright7=ffffff
selection-foreground=f2f2f2
selection-background=363983
