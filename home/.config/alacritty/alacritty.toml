[env]
WINIT_X11_SCALE_FACTOR = "1"
TERM = "xterm-256color"

[terminal]
shell = { program = "/run/current-system/sw/bin/fish", args = ["--interactive"] }

[window]
opacity = 0.95
# padding = {x = 12, y = 3}
dynamic_padding = true
decorations = "None"
class = {general = "Alacritty", instance = "Alacritty"}

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11
# offset = { x = 0, y = 1 }
# glyph_offset = { x = 0, y = 1 }
builtin_box_drawing = false

[cursor]
blink_interval = 500
unfocused_hollow = true
thickness = 0.2

[general]
# Color-theme
# import = ["~/.config/alacritty/themes/nightlify_mod.toml"]
# import = ["~/.config/alacritty/themes/pastel.toml"]
# import = ["~/.config/alacritty/themes/midnight-haze.toml"]
import = ["~/.config/alacritty/themes/catppuccin_mocha.toml"]
