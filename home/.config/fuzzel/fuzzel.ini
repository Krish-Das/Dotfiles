[main]
font=SF Pro Text:size=14
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="› "

lines=10
width=40
horizontal-pad=20
vertical-pad=15
inner-pad=8
line-height=20

[colors]
background=1e1e1ef5
text=ffffffff
prompt=ffffff88
placeholder=ffffff44
input=ffffffff
match=007affff
selection=3a3a3cff
selection-text=ffffffff
selection-match=007affff
border=ffffff18

[border]
width=1
radius=12

[dmenu]
mode=text
exit-immediately-if-empty=no
