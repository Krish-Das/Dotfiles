# monitor=,preferred,auto,auto
# name, resolution, position(x,y), scaling
monitor = DP-1,1366x768,0x0,1
monitor = HDMI-A-1,1366x768,1366x0,1
# monitor = HDMI-A-1,1366x768,0x0,1

misc {
  enable_swallow = false
  swallow_regex = ^(Alacritty|kitty)$

  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background.
}

source = ./config/environment.conf
source = ./config/autostart.conf
source = ./config/keybinds.conf
source = ./config/appearance.conf
source = ./config/inputs.conf
source = ./config/windowrules.conf
