# See https://wiki.hyprland.org/Configuring/Keywords/
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

$mainMod = SUPER
$scrPath = "$HOME/.local/bin/"
$terminal = ghostty
$fileManager = thunar
$menu = tofi-drun

# Screenshot
bind = , Print, exec, screenshot.sh

# Keyboard layout
bind = $mainMod SHIFT, space, exec, hyprctl switchxkblayout current next && notify-send "Changed layout!"

# Launchers
bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, return, exec, alacritty
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, space, exec, $menu
bind = $mainMod, V, exec, tofi-clip.sh

# Layout bindings
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo # dwindle
bind = $mainMod, BackSlash, togglesplit # dwindle 

# Bindings for windows
# Move focus with mainMod + control + H-J-K-L keys
bind = $mainMod CTRL, H, movefocus, l
bind = $mainMod CTRL, L, movefocus, r
bind = $mainMod CTRL, K, movefocus, u
bind = $mainMod CTRL, J, movefocus, d

# Move windows with mainMod + Control_R + Arrow keys
bind = $mainMod Control_R, left, swapwindow, l
bind = $mainMod Control_R, down, swapwindow, d
bind = $mainMod Control_R, up, swapwindow, u
bind = $mainMod Control_R, right, swapwindow, r

# sets repeatable binds for resizing the active window
# binde = $mainMod Alt, L, resizeactive, 10 0
# binde = $mainMod Alt, H, resizeactive, -10 0
# binde = $mainMod Alt, K, resizeactive, 0 -10
# binde = $mainMod Alt, J, resizeactive, 0 10

# Switch to the most recent workspaces with mainmod + Tab
bind= $mainMod, Tab, workspace, previous

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, H, workspace, 8
bind = $mainMod, T, workspace, 9
bind = $mainMod, N, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, H, movetoworkspace, 8
bind = $mainMod SHIFT, T, movetoworkspace, 9
bind = $mainMod SHIFT, N, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scroll through existing workspaces with mainMod + >/<
bind = $mainMod, Period, workspace, e+1
bind = $mainMod, Comma, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Groups
# https://wiki.hyprland.org/Configuring/Dispatchers/#list-of-dispatchers
#
bind = $mainMod, G, togglegroup 
bind = $mainMod, grave, changegroupactive, f
bind = $mainMod SHIFT, grave, changegroupactive, b
bind = Control_L, right, movewindoworgroup, r
bind = Control_L, left, movewindoworgroup, l

# lockgroups        lock / unlock / toggle    [ALL]
# lockactivegroup   lock / unlock / toggle    [ACTIVE]

# Killing windows
bind = $mainMod SHIFT, BackSpace, killactive
bind = $mainMod SHIFT, Delete, exec, powermenu.sh

# Vendor keys
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
