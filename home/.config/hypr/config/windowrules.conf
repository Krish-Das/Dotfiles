# Ignore maximize requests from apps.
windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = noshadow, focus:0

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = noblur,class:^()$,title:^()$
windowrulev2 = opacity 1.0 override 1.0 override,class:^()$,title:^()$

windowrulev2 = opacity 0.0 override 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$

# windowrule=float, ^(imv)$
# windowrule=float, ^(mpv)$
# windowrule=center, ^(MuPDF)$
# windowrule=float, ^(MuPDF)$

#
# █░█░█ █▀█ █▀█ █▄▀ █▀ █▀█ ▄▀█ █▀▀ █▀▀
# ▀▄▀▄▀ █▄█ █▀▄ █░█ ▄█ █▀▀ █▀█ █▄▄ ██▄
#
# workspace = 3, gapsout:3, gapsin:3
# windowrulev2 = float, onworkspace:4
# windowrulev2 = bordersize 2, onworkspace:4

#
# █▀▀ █░░ █▀█ ▄▀█ ▀█▀ █ █▄░█ █▀▀
# █▀░ █▄▄ █▄█ █▀█ ░█░ █ █░▀█ █▄█
#
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = size 600 500,class:^(nwg-look)$

windowrulev2 = float,class:^(thunar)$
windowrulev2 = size 900 600,class:^(thunar)$

windowrulev2 = float,class:^(.*gnome.*)$
windowrulev2 = float,class:^(.*localsend.*)$

windowrulev2 = float,title:(Not\ titled.*)
windowrulev2 = size 900 600,title:(Not\ titled.*)

windowrulev2 = float,class:^(.*pavucontrol.*)$
windowrulev2 = size 800 600,class:^(.*pavucontrol.*)$

windowrulev2 = float,class:^(.*Celluloid.*)$

windowrulev2 = float,initialTitle:Warehouse
windowrulev2 = size 900 600,initialTitle:Warehouse

windowrulev2 = float,title:^(Albert)$
windowrulev2 = noblur, title:^(Albert)$
windowrulev2 = noborder,title:^(Albert)$
windowrulev2 = stayfocused, class:^(Albert)$
windowrulev2 = dimaround, title:^(Albert)$

windowrulev2 = workspace 6,class:^(com.obsproject.Studio)$

# windowrulev2 = float,class:^(scrcpy)$
# windowrulev2 = size 1366 615,class:^(scrcpy)$
# windowrulev2 = move 0 0,class:^(scrcpy)$
# windowrulev2 = workspace 6,class:^(scrcpy)$
# windowrulev2 = rounding 0,class:^(scrcpy)$
windowrulev2 = float,class:.*scrcpy.*
windowrulev2 = size 1366 615,class:.*scrcpy.*
windowrulev2 = move 0 0,class:.*scrcpy.*
windowrulev2 = workspace 6,class:.*scrcpy.*
windowrulev2 = rounding 0,class:.*scrcpy.*

windowrulev2 = workspace 4,class:^(Spotify)$


#
# █░░ ▄▀█ █▄█ █▀▀ █▀█
# █▄▄ █▀█ ░█░ ██▄ █▀▄
#
layerrulev2 = blur, swaync-control-center
layerrulev2 = blur, swaync-notification-window

layerrulev2 = ignorezero, swaync-control-center
layerrulev2 = ignorezero, swaync-notification-window

layerrulev2 = ignorealpha 0.5, swaync-control-center
layerrulev2 = ignorealpha 0.5, swaync-notification-window

#
# █▀▄ █▀█ █▀▀ █▀
# █▄▀ █▄█ █▄▄ ▄█
#
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
