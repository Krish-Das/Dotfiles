input {
  kb_layout = us,us
  kb_variant = dvorak,
  # kb_model =
  # kb_rules =

  # Keyboard modification
  kb_options = fkeys:basic_13-24
  # kb_options = caps:escape_shifted_capslock # services.keyd in nixos for kernel level remap
  # kb_options = caps:swapescape

  repeat_delay = 300
  repeat_rate = 35

  # Mouse follows focus
  follow_mouse = 1

  # Mouse acceleration
  accel_profile = flat
  force_no_accel = 1

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  touchpad {
    natural_scroll = false
  }
}

cursor {
  no_hardware_cursors = true
  hide_on_key_press = true
}
