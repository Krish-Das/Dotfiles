"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documents"
desc = "Goto ~/Documents"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Pictures"
desc = "Goto ~/Pictures"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "cd ~/Videos"
desc = "Goto ~/Videos"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd ~/Repos"
desc = "Goto ~/Repos"
